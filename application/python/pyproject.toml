[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-lattice-cli"
version = "0.1.0"
description = "Crystal Lattice command-line and HTTP frontend for agent-core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AI Agent Platform Team"}
]
dependencies = [
    "agent-core>=0.3.0",
    "fastapi",
    "uvicorn[standard]",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.148.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
binary = [
    "pyinstaller>=6.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
crystal-lattice = "agent_terminal_app.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_terminal_app*"]

[tool.setuptools.package-data]
agent_terminal_app = [
    "*.json",
    "runtime_layout.json",
    "default_config/*.json",
    "default_config/*.md",
    "default_config/cloud-agent/**/*",
    "default_config/codex/**/*.json",
    "default_config/codex/**/*.md",
    "default_config/system_messages/**/*.md",
    "default_config/system_messages/**/*.py",
    "system_messages/**/*.md",
    "system_messages/**/*.py",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not docker'"
markers = [
    "integration: integration tests that may hit real services",
    "api: hosted API integration tests requiring credentials and potentially incurring cost",
    "slow_integration: slow integration tests that should be run selectively",
    "docker: tests that require Docker",
    "ollama: tests that require a local Ollama server and model",
    "gemini: tests requiring Gemini credentials",
    "openai: tests requiring OpenAI credentials",
    "openrouter: OpenRouter integration tests",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-terminal-app"
version = "0.1.0"
description = "Minimal FastAPI + prompt_toolkit frontend for agent-core"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Agent Platform Team"}
]
dependencies = [
    "agent-core>=0.3.0",
    "fastapi",
    "uvicorn[standard]",
    "prompt_toolkit>=3.0.0",
    "python-dotenv>=1.0.0",
    "zeroconf>=0.148.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["agent_terminal_app*"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that may hit real services",
    "openai: tests requiring OpenAI credentials",
    "ollama: Ollama integration tests",
    "openrouter: OpenRouter integration tests",
]

services:
  proxy:
    build:
      context: ${REVIEWER_PROXY_BUILD_CONTEXT:-../..}
      args:
        NODE_IMAGE: ${REVIEWER_PROXY_NODE_IMAGE:-node:22-alpine}
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --config
      - /config/reviewer-proxy.json
    volumes:
      - ${REVIEWER_PROXY_CONFIG_PATH:-./config/reviewer-proxy.json}:/config/reviewer-proxy.json:ro
      - ${REVIEWER_PROXY_DATA_PATH:-./data}:/data
    expose:
      - ${PROXY_INTERNAL_PORT:-3000}

  tls:
    image: ${REVIEWER_PROXY_TLS_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      - proxy
    environment:
      PROXY_INTERNAL_PORT: ${PROXY_INTERNAL_PORT:-3000}
      REVIEWER_PROXY_SERVER_NAME: ${REVIEWER_PROXY_SERVER_NAME:-localhost}
    ports:
      - ${REVIEWER_PROXY_BIND_ADDRESS:-0.0.0.0}:${REVIEWER_PROXY_PORT:-3443}:443
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${REVIEWER_PROXY_CERT_PATH:-./certs/server.crt}:/etc/reviewer-tls/server.crt:ro
      - ${REVIEWER_PROXY_KEY_PATH:-./certs/server.key}:/etc/reviewer-tls/server.key:ro
global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client 300000
    timeout server 300000

frontend bridge_frontend
    # TLS termination happens here
    # Expect a PEM bundle at /usr/local/etc/haproxy/certs/bridge.pem
    bind *:4000 ssl crt /usr/local/etc/haproxy/certs/bridge.pem alpn h2,http/1.1
    default_backend bridge_nodes

backend bridge_nodes
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200

    server bridge-node-1 bridge-node-1:4001 check inter 5s fall 3 rise 2
    server bridge-node-2 bridge-node-2:4002 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s

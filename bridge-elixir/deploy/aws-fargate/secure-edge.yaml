AWSTemplateFormatVersion: '2010-09-09'
Description: Crystal Lattice bridge stable CloudFront edge.

Parameters:
  StackName:
    Type: String
  OriginDomainName:
    Type: String
  DomainName:
    Type: String
    Default: ''
  HostedZoneId:
    Type: String
    Default: ''

Conditions:
  UseCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  UseRoute53: !And [!Condition UseCustomDomain, !Not [!Equals [!Ref HostedZoneId, '']]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: UseCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !If [UseRoute53, !Ref HostedZoneId, !Ref AWS::NoValue]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Crystal Lattice bridge ${StackName}'
        Aliases: !If [UseCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        Origins:
          - Id: bridge-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: bridge-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        HttpVersion: http2
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  DomainAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: UseRoute53
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  BridgeHttpUrl:
    Value: !If
      - UseCustomDomain
      - !Sub 'https://${DomainName}/health'
      - !Sub 'https://${Distribution.DomainName}/health'
  BridgeWebSocketUrl:
    Value: !If
      - UseCustomDomain
      - !Sub 'wss://${DomainName}/ws/websocket'
      - !Sub 'wss://${Distribution.DomainName}/ws/websocket'
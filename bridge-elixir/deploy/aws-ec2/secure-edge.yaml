AWSTemplateFormatVersion: "2010-09-09"
Description: Crystal Lattice bridge generated CloudFront edge.

Parameters:
  StackName:
    Type: String
  OriginDomainName:
    Type: String

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${StackName} bridge
        Origins:
          - Id: ec2-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPPort: 4000
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: true
            Headers:
              - Authorization
              - Content-Type
              - X-Crystal-Bridge-Token
              - X-Crystal-Bridge-Body-Present
              - Sec-WebSocket-Key
              - Sec-WebSocket-Version
              - Sec-WebSocket-Protocol
              - Sec-WebSocket-Accept
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        HttpVersion: http2
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  BridgeHttpUrl:
    Value: !Sub https://${Distribution.DomainName}/health
  BridgeWebSocketUrl:
    Value: !Sub wss://${Distribution.DomainName}/ws/websocket
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref Distribution
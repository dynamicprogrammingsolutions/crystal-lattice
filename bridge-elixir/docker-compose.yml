version: '3.8'

services:
  bridge-node-1:
    build: .
    container_name: bridge-node-1
    hostname: bridge-node-1
    environment:
      - NODE_NAME=bridge
      - COOKIE=bridge_secret_cookie
      - PORT=4001
      - GOSSIP_PORT=45892
      - GOSSIP_MULTICAST_ADDR=230.1.1.251
      - MIX_ENV=prod
    networks:
      bridge_network:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  bridge-node-2:
    build: .
    container_name: bridge-node-2
    hostname: bridge-node-2
    environment:
      - NODE_NAME=bridge
      - COOKIE=bridge_secret_cookie
      - PORT=4002
      - GOSSIP_PORT=45892
      - GOSSIP_MULTICAST_ADDR=230.1.1.251
      - MIX_ENV=prod
    networks:
      bridge_network:
        ipv4_address: 172.28.0.12
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  haproxy:
    image: haproxy:2.8-alpine
    container_name: haproxy
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "4000:4000"
      - "8404:8404"
    networks:
      - bridge_network
    depends_on:
      - bridge-node-1
      - bridge-node-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8404/stats"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  bridge_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

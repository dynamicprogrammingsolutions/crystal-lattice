site_name: Crystal Lattice Docs
site_description: Plugin-driven AI agent platform documentation
site_url: "https://docs.crystallattice.dev.dynamicprogrammingsolutions.com/"
repo_url: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
repo_name: GitHub
use_directory_urls: true

theme:
  name: material
  custom_dir: docs_site/overrides
  logo: assets/brand/icon_dark.svg
  favicon: assets/brand/icon.svg
  icon:
    repo: crystal-lattice/github
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: crystal-lattice/sun
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: crystal-lattice/moon
        name: Switch to dark mode

extra_css:
  - assets/styles/crystal-lattice.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Add the core package path so imports resolve during builds
          paths:
            - .
            - core/python
          options:
            docstring_style: google
            show_source: true
            separate_signature: true
            merge_init_into_class: true
            inherited_members: false
            members_order: alphabetical

nav:
  - Overview: index.md
  - Guides:
    - Plugin Development: plugins/development.md
    - Application Configuration: plugins/application-config.md
  - Reference:
    - AgentCore: reference/agent_core/core.md
    - Types & Protocols: reference/agent_core/types.md
    - Provider Wrapper: reference/agent_core/plugin/provider.md
    - OpenAI-Compatible Provider: reference/providers/openai_provider.md
    - Tool Host Protocol: reference/tool-host-protocol.md

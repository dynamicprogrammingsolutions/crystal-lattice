server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for content-hashed bundles
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Exact file → directory index → 404
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}

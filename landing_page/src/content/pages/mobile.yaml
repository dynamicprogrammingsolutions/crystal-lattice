seo:
  title: "Crystal Lattice: Mobile App"
  description: "The Crystal Lattice companion app for iOS and Android. Chat with your AI agents, manage sessions, and switch providers. All connected to your own server."

sections:
  - type: mobileHero
    label: "Crystal Lattice Control"
    titleHtml: "Your AI agents,<br />in your pocket"
    subtitle: "The official iOS and Android companion for Crystal Lattice. Browse sessions, send messages, watch responses stream in real time, manage plugins and settings, all from your phone on your own server."
    platforms:
      - label: "iOS"
        icon: apple
      - label: "Android"
        icon: android
    storeButtons:
      - href: "#"
        className: "app-store"
        icon: apple
        sub: "Download on the"
        name: "App Store"
      - href: "#"
        className: "play-store"
        icon: play
        sub: "Get it on"
        name: "Google Play"
    note: "Free · Requires a Crystal Lattice server"
    image:
      src: "/cl-mobile-frame.png"
      alt: "Crystal Lattice Control mobile app"

  - type: mobileFeatures
    id: features
    eyebrow: "What you get"
    titleHtml: "A full-featured client,<br />not a thin wrapper"
    body: "The mobile app exposes the complete Crystal Lattice API. Anything you can do from the terminal, you can do from your phone."
    items:
      - icon: stream
        title: "Real-time streaming"
        desc: "Messages stream token-by-token as they're generated. Partial messages appear instantly, replaced by the final response when complete."
      - icon: chat
        title: "Session management"
        desc: "Browse all your sessions, resume any conversation, and create new ones. Each has its own model, provider, and configuration."
      - icon: provider
        title: "Provider & model switching"
        desc: "Switch between OpenAI, Anthropic, Ollama, and others per session. Change the model mid-conversation without losing context."
      - icon: plugin
        title: "Plugin controls"
        desc: "Enable or disable plugins from the app. Tool results and agent actions are shown inline in the conversation as they happen."
      - icon: wifi
        title: "Connection methods"
        desc: "Connect via manual IP, zero-config Bonjour discovery on the same network, or a pairing-code bridge for remote access."
      - icon: info
        title: "Thinking blocks"
        desc: "Models with reasoning traces (Ollama, OpenRouter) show their thinking inline, collapsible so the conversation stays readable."

  - type: mobileConnect
    id: connect
    eyebrow: "Connectivity"
    title: "Connect from anywhere"
    body: "Three ways to link your phone to your server. Pick whatever fits your setup."
    methods:
      - num: "01"
        title: "Manual address"
        desc: "Enter your server's IP and port directly. Works on any network as long as you can reach the host."
        code: "http://192.168.1.42:9000"
      - num: "02"
        title: "Auto-discovery"
        desc: "On the same local network, the app finds your server automatically via Bonjour/mDNS. No config needed."
        code: "crystal-lattice ... --enable-bonjour"
      - num: "03"
        title: "Bridge pairing"
        desc: "Connect from anywhere with a pairing code. Start the bridge service, tap the code in the app, and you're connected."
        code: "crystal-lattice ... --enable-bridge"

  - type: mobileDownload
    title: "Get the app"
    body: "Free to download. Connects to any Crystal Lattice server running on your network or reachable via the bridge service."
    storeButtons:
      - href: "#"
        icon: apple
        sub: "Download on the"
        name: "App Store"
      - href: "#"
        icon: play
        sub: "Get it on"
        name: "Google Play"
    noteHtml: "Need the server first? <a href=\"/#quickstart\">Get Crystal Lattice →</a>"

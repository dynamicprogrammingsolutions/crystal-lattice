seo:
  title: "Crystal Lattice: Mobile App"
  description: >-
    Open Crystal Lattice sessions from your phone, watch responses stream, and
    reconnect through local network discovery or the bridge.

sections:
  - type: mobileHero
    label: "Crystal Lattice Control"
    titleHtml: "Your agent workspace,<br />from your phone"
    subtitle: >-
      Browse sessions, send messages, and watch responses stream from Crystal
      Lattice running on your computer. Store releases are coming soon; source
      builds are available today.
    platforms:
      - label: "iOS"
        icon: apple
      - label: "Android"
        icon: android
    storeButtons:
      - className: "app-store"
        icon: apple
        sub: "Coming soon"
        name: "App Store"
        comingSoon: true
      - className: "play-store"
        icon: play
        sub: "Coming soon"
        name: "Google Play"
        comingSoon: true
      - href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice/tree/main/mobile/crystal-lattice-control-rn"
        className: "source"
        icon: github
        sub: "Available today"
        name: "Run from source"
    note: "Store releases coming soon · Source builds available today"
    image:
      src: "/cl-mobile-frame.png"
      alt: "Crystal Lattice Control mobile app"

  - type: mobileFeatures
    id: features
    eyebrow: "What you get"
    titleHtml: "A phone view for<br />real agent work"
    body: >-
      Open sessions, send messages, watch streams, and use supported
      plugin-driven controls from your phone.
    items:
      - icon: stream
        title: "Real-time streaming"
        desc: >-
          Messages stream token-by-token as they're generated. Partial messages
          appear instantly, replaced by the final response when complete.
      - icon: chat
        title: "Session management"
        desc: >-
          Browse all your sessions, resume any conversation, and create new
          ones. Sessions keep their own agent configuration, message history,
          and state.
      - icon: provider
        title: "Configured agents"
        desc: >-
          Work with the agents you have configured on your computer. Provider
          and model-family capabilities can vary, so Crystal Lattice keeps this
          behavior plugin-driven.
      - icon: plugin
        title: "Plugin controls"
        desc: >-
          Supported plugin-exposed controls, tool results, and agent actions are
          shown inline in the conversation as they happen.
      - icon: wifi
        title: "Connection methods"
        desc: >-
          Connect via manual IP, automatic discovery on the same network, or a
          pairing-code bridge when your phone is outside that network.
      - icon: info
        title: "Thinking blocks"
        desc: >-
          Models with reasoning traces (Ollama, OpenRouter) show their thinking
          inline when the configured provider and plugins expose them,
          collapsible so the conversation stays readable.

  - type: mobileConnect
    id: connect
    eyebrow: "Connectivity"
    title: "Connect from anywhere"
    body: "Three ways to link your phone to Crystal Lattice. Pick whatever fits your setup."
    methods:
      - num: "01"
        title: "Manual address"
        desc: "Enter the address of the Crystal Lattice process running on your computer. Works wherever your phone can reach that address."
        code: "http://192.168.1.42:9000"
      - num: "02"
        title: "Auto-discovery"
        desc: "On the same Wi-Fi, the app can find your computer automatically. Under the hood, this uses Bonjour/mDNS."
        code: "crystal-lattice ... --enable-bonjour"
      - num: "03"
        title: "Bridge pairing"
        desc: >-
          When your phone is outside the local network, pair through a bridge.
          Deploy the bridge, start Crystal Lattice with its bridge URL, then
          connect with the pairing code.
        code: "crystal-lattice ... --bridge-url wss://<your-cloudfront-domain>/ws/websocket"

  - type: mobileDownload
    title: "Mobile app availability"
    body: >-
      Store releases are coming soon. Today, you can build the mobile app from
      source and connect it to Crystal Lattice on your network or through the
      bridge.
    storeButtons:
      - icon: apple
        sub: "Coming soon"
        name: "App Store"
        comingSoon: true
      - icon: play
        sub: "Coming soon"
        name: "Google Play"
        comingSoon: true
      - href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice/tree/main/mobile/crystal-lattice-control-rn"
        icon: github
        sub: "Available today"
        name: "Run from source"
    noteHtml: 'Need Crystal Lattice first? <a href="/#quickstart">Get started →</a>'

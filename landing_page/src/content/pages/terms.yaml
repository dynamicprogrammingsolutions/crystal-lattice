seo:
  title: "Terms of Use — Crystal Lattice"
  description: "Crystal Lattice terms of use. Open source software distributed under the Apache 2.0 license."

sections:
  - type: legalContent
    label: "Legal"
    title: "Terms of Use"
    meta: "Effective date: May 2025"
    sections:
      - title: "Open source software"
        blocks:
          - type: paragraph
            html: "Crystal Lattice — including the CLI, server, agent-core SDK, bridge service, and mobile app — is open source software distributed under the <a href=\"https://www.apache.org/licenses/LICENSE-2.0\" target=\"_blank\" rel=\"noopener\">Apache License, Version 2.0</a>."
          - type: paragraph
            html: "You may use, copy, modify, merge, publish, distribute, sublicense, and sell copies of the software in accordance with the terms of that license. A copy of the license is included in the source repository and is also available at the link above."
      - title: "Website terms"
        blocks:
          - type: paragraph
            html: "These terms govern your use of crystallattice.dev (the \"Site\"). By accessing the Site, you agree to these terms. If you do not agree, please do not use the Site."
          - type: paragraph
            html: "The Site provides information about the Crystal Lattice open source project. Content is provided for informational purposes only."
      - title: "No warranty"
        blocks:
          - type: paragraph
            html: "The software is provided \"as is,\" without warranty of any kind, express or implied, including but not limited to the warranties of merchantability, fitness for a particular purpose, and non-infringement."
          - type: paragraph
            html: "In no event shall the authors or copyright holders be liable for any claim, damages, or other liability, whether in an action of contract, tort or otherwise, arising from, out of, or in connection with the software or the use or other dealings in the software."
      - title: "Your responsibilities"
        blocks:
          - type: paragraph
            html: "When using Crystal Lattice, you are responsible for:"
          - type: list
            items:
              - "Complying with the terms of service of any AI provider you connect to (OpenAI, Anthropic, Google, OpenRouter, etc.)."
              - "Securing your server appropriately if you expose it on a network. The server binds to <code>0.0.0.0</code> when you pass <code>--host 0.0.0.0</code> — only do this on trusted networks or behind appropriate access controls."
              - "Managing and protecting any API keys used to configure AI providers."
              - "Ensuring your use of AI-generated content complies with applicable laws in your jurisdiction."
      - title: "Third-party services"
        blocks:
          - type: paragraph
            html: "Crystal Lattice integrates with third-party AI providers. Use of those services is governed by their respective terms of service and privacy policies, not by these terms. We are not affiliated with, endorsed by, or responsible for any third-party provider."
          - type: paragraph
            html: "The bridge service is an optional component. Use of the bridge service is subject to its own infrastructure terms where applicable."
      - title: "Intellectual property"
        blocks:
          - type: paragraph
            html: "The Crystal Lattice name, logo, and associated branding are the property of the project maintainers. The Apache 2.0 license grants broad rights to use, modify, and distribute the software itself, but does not grant rights to use the project's trademarks or branding in ways that imply official endorsement."
      - title: "Contributions"
        blocks:
          - type: paragraph
            html: "Contributions to the Crystal Lattice project are governed by the Apache 2.0 license and the contribution guidelines in the repository. By submitting a pull request, you agree that your contribution may be distributed under those terms."
      - title: "Changes"
        blocks:
          - type: paragraph
            html: "We may update these terms as the project evolves. Changes will be posted to this page with an updated effective date. Continued use of the Site after changes constitutes acceptance of the updated terms."
      - title: "Contact"
        blocks:
          - type: paragraph
            html: "Questions about these terms can be directed to the project via GitHub Issues or the contact information in the repository."

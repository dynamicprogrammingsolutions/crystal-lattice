seo:
  title: "Crystal Lattice: Plugin-driven AI agent workspace"
  description: >-
    Run AI agents your way: start on your computer, continue from your phone,
    and customize tools, prompts, settings, and model-family harnesses through
    plugins.

sections:
  - type: hero
    id: hero
    badge: "Plugin-driven agent workspace"
    titleHtml: 'Own the harness.<br /><span class="highlight">Use the agent anywhere.</span>'
    subtitle: >-
      Crystal Lattice is a plugin-driven platform for running AI agents your
      way: from your computer, from your phone, and through custom tools,
      prompts, settings, and model-family harnesses you can replace.
    actions:
      - label: "Get started"
        href: "#quickstart"
        variant: primary
        icon: arrow
      - label: "View on GitHub"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
        variant: outline
        icon: github
        target: "_blank"
    install:
      prompt: "$"
      command: "curl -fsSL https://crystal-lattice-downloads-874087778966.s3.us-east-1.\
        amazonaws.com/crystal-lattice-cli/install.sh | bash"
      altHtml: "or <code>pipx install crystal-lattice-cli</code>"

  - type: providers
    label: "Works with"
    providers:
      - "OpenAI"
      - "Anthropic"
      - "Google Gemini"
      - "OpenRouter"
      - "Ollama"
      - "OpenAI-compatible APIs"

  - type: features
    id: features
    source: "../markdown/home-features.md"

  - type: quickstart
    id: quickstart
    eyebrow: "Quickstart"
    title: "Up and running in two minutes"
    body: "Install the CLI, start Crystal Lattice, connect from your phone."
    steps:
      - num: "1"
        title: "Install"
        body:
          - html: "One-line installer for macOS & Linux:"
        codeBlocks:
          - "curl -fsSL https://crystal-lattice-downloads-874087778966.s3.us-east-1.\
            amazonaws.com/crystal-lattice-cli/install.sh | bash"
        after:
          - html: "Or via pipx:"
        afterCodeBlocks:
          - "pipx install crystal-lattice-cli"
      - num: "2"
        title: "Start Crystal Lattice"
        body:
          - html: "Create a working directory and launch:"
        codeBlocks:
          - |
            mkdir ~/crystal-lattice && cd ~/crystal-lattice

            crystal-lattice \
              --server \
              --console \
              --config-local \
              --host 0.0.0.0 \
              --port 9000
        after:
          - html: "Add a provider key to <code>.crystal/config.json</code> to enable model calls."
      - num: "3"
        title: "Connect your phone"
        body:
          - html: "Find your LAN IP:"
        codeBlocks:
          - |
            hostname -I              # Linux
            ipconfig getifaddr en0   # macOS
        after:
          - html: "In the app: <strong>Manual Address → &lt;IP&gt;:9000 → Connect</strong>"
          - html: "Or launch with <code>--enable-bonjour</code> so the app can find your computer automatically on the same Wi-Fi."

  - type: cta
    title: "Start running your own AI platform"
    body: >-
      Crystal Lattice is developed in the open. Install the CLI, start Crystal
      Lattice, and have your first agent session running in minutes.
    actions:
      - label: "Install the CLI"
        href: "#quickstart"
        variant: primary
        icon: arrow
      - label: "Read the docs"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice#readme"
        variant: outline
        target: "_blank"
      - label: "View on GitHub"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
        variant: outline
        icon: github
        target: "_blank"

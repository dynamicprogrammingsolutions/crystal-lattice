seo:
  title: "Crystal Lattice: Model-native agents you can control"
  description: >-
    A plugin-driven agent platform for people who outgrow one-size-fits-all
    harnesses. Built-in model-family plugins provide Codex, Claude, Gemini,
    Qwen, Kimi, and Grok-style defaults, while your config can replace the
    provider, tools, settings, UI actions, and session workflow.

sections:
  - type: hero
    id: hero
    badge: "Open Source"
    titleHtml: 'For people who outgrow<br /><span class="highlight">one-size-fits-all agents.</span>'
    subtitle: >-
      Crystal Lattice is a model-native agent platform: the harness changes
      around the model, including its system message, tool schema, request
      behavior, provider-native state, and UI controls. Built-in plugins provide
      Codex, Claude, Gemini, Qwen, Kimi, and Grok-style defaults, and your config
      can replace them.
    actions:
      - label: "Get started"
        href: "#getting-started"
        variant: primary
        icon: arrow
      - label: "View on GitHub"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
        variant: outline
        icon: github
        target: "_blank"

  - type: featureShowcase
    id: product-highlights
    layout: "two-column"
    presentation: "editorial"
    reviewStatus: "Structural prototype · copy and proof unapproved"
    items:
      # List order controls reading order; layout: full-width expands an item.
      # To use option A, reorder these entries and remove the two full-width flags.
      - id: feature-model-families
        title: "One workspace for every model family."
        description: >-
          Use Codex-, Claude-, Gemini-, Qwen-, Kimi-, and Grok-oriented profiles
          without switching between separate model-specific clients. Each
          profile keeps its model-family instructions, tools, and request
          behavior inside the same workspace.
        reviewStatus: "Draft · proof needed"
        media:
          kind: "Configured agents"
          status: "draft-review"
          assets:
            - label: "Codex"
              description: "Plugin-driven instructions and tools: Apply Patch, Shell, and View Image. Easily tailor the setup to your use case."
              src: "/homepage-draft/agent-codex-light.webp"
              srcDark: "/homepage-draft/agent-codex-dark.webp"
              alt: "Compact Crystal Lattice Desktop agent picker with Codex selected and Apply Patch, Shell, View Image, and Read File defaults visible."
              width: 1400
              height: 980
            - label: "Claude"
              description: "Plugin-driven instructions and tools: Read, Write, Edit, Glob, Grep, and Bash. Easily tailor the setup to your use case."
              src: "/homepage-draft/agent-claude-light.webp"
              srcDark: "/homepage-draft/agent-claude-dark.webp"
              alt: "Compact Crystal Lattice Desktop agent picker with Claude selected and Read, Write, Edit, Glob, Grep, and Bash defaults visible."
              width: 1400
              height: 980
      - id: feature-work-anywhere
        title: "Work from anywhere."
        description: >-
          Start in the terminal or Desktop app and continue the same session
          from your phone. Connect on the same network or through a self-hosted
          bridge when you are away.
        reviewStatus: "Draft · proof needed"
        media:
          kind: "Cross-device session"
          status: "placeholder-needed"
          assets:
            - label: "Desktop and mobile"
              description: "Continue the same conversation across devices. Plugin-driven agents and session controls are easy to adapt to your workflow."
              placeholder: >-
                A Desktop window and a phone showing the same conversation:
                matching session title, latest question, and answer.
      - id: feature-vibe-anything
        title: "Vibe code—or vibe anything."
        description: >-
          Turn the same agent platform toward software work, research,
          operations, content, evaluations, internal automation, or a workflow
          built from your own tools and plugins.
        reviewStatus: "Draft · proof needed"
        media:
          kind: "Non-development workflow"
          status: "draft-review"
          assets:
            - label: "Research and planning"
              description: "Easily adapt plugin-driven instructions and tools for research, planning, or another use case."
              src: "/homepage-draft/vibe-light.webp"
              srcDark: "/homepage-draft/vibe-dark.webp"
              alt: "A System message, a user request with launch-data attachments, and initial research-agent reasoning are visible together."
              width: 520
              height: 1131
      - id: session-workbench
        title: "Sessions become workspaces."
        description: >-
          Titles, subtitles, status, pinned state, snapshots, attachments, and
          actions turn conversations into durable workspaces. These behaviors
          are plugin-driven: keep them, disable them, replace them, or refine
          them for your workflow.
        reviewStatus: "Draft · proof needed"
        media:
          kind: "Durable sessions"
          status: "placeholder-needed"
          assets:
            - label: "Organize your sessions"
              description: "Plugin-driven titles, subtitles, pinning, and status keep work organized. Easily adjust them to your use case."
              placeholder: >-
                Desktop session list with descriptive titles, subtitles, and
                status. A pin star sits at the top right; archive and status
                controls remain visible beside the open action menu.
            - label: "Control the conversation"
              description: "Plugin-driven conversation actions let you fork or change history. Easily keep, replace, or refine them for your workflow."
              placeholder: >-
                A Desktop conversation with Message actions open, highlighting
                Fork here, Delete from here, and OpenAI compaction up to here.
      - id: feature-plugins
        layout: full-width
        title: "Replace the parts you disagree with."
        description: >-
          Providers, tools, model defaults, actions, settings, and UI elements
          are plugin surfaces. Keep the built-in experience where it works and
          replace only the layers your workflow disagrees with.
        reviewStatus: "Draft · proof needed"
        media:
          kind: "Plugin architecture"
          status: "placeholder-needed"
          assets:
            - label: "Session actions"
              description: "These session actions are plugin-driven and easy to adjust to your use case."
              placeholder: >-
                Plugin configuration on the left connects to the open Session
                actions menu on the right: Edit title, Generate title, and
                Summarize range. The conversation remains visible behind the menu.
            - label: "Actions for each message"
              description: "Fork, summarize, or share with plugin-driven actions. Easily tailor them to your use case."
              placeholder: >-
                Configuration connects to the real Message actions menu.
                Three plugin packages provide Fork here, Summarize messages
                up to here, and sharing as both PDF and Markdown.
      - id: feature-transparency
        layout: full-width
        title: "Transparency by design."
        description: >-
          Framework and plugin boundaries make instructions, configuration,
          tools, state, and provider metadata visible and user-modifiable.
          Usage, cache, duration, and cost remain visible when the provider
          supplies them. Open source adds full source-level transparency.
        reviewStatus: "Draft · proof needed"
        media:
          kind: "Inspectable execution"
          status: "placeholder-needed"
          assets:
            - label: "Inspect the instructions"
              description: "See the beginning of the Codex default. These plugin-driven instructions are easy to adjust to your use case."
              placeholder: >-
                The compiled system-message window shows the beginning of
                the current Codex default, including its introduction and
                permission guidance.
            - label: "Costs and ChatGPT usage"
              description: "These reports are plugin-driven and easy to adapt to your use case: choose the buckets, time windows, and measures that matter."
              placeholder: >-
                One focused illustrative report shows three days of daily
                claude costs of $20–50 and zai costs of $2–10. ChatGPT usage
                since reset shows a three-day interval, estimated total cost,
                and percentage change within a seven-day window, assuming
                about $550 corresponds to 100%. Screenshot currency uses two
                decimal places. Sample data.

  - type: gettingStarted
    id: getting-started
    title: "Getting started"
    reviewStatus: "Structural prototype · visual treatment unsettled"
    steps:
      - id: "install-cli"
        kind: "install"
        title: "Install the CLI"
        description: >-
          Install the local Crystal Lattice runtime for your platform. This is
          the process that owns agents, sessions, tools, and client connections.
        reviewStatus: "Structure approved · copy draft"
        install:
          ariaLabel: "Install Crystal Lattice"
          defaultMethod: "macos-linux"
          methods:
            - id: "macos-linux"
              tabLabel: "macOS/Linux"
              panelLabel: "Terminal"
              kind: "command"
              prompt: "$"
              command: "curl -fsSL https://download.crystallattice.dev/crystal-lattice-cli/install.sh | bash"
              support: "macOS Intel or Apple silicon · Linux x64 or ARM64"
              documentation:
                label: "Installation guide"
                href: "$docsUrl/packages/application-python/installation/"
            - id: "windows"
              tabLabel: "Windows"
              panelLabel: "Windows PowerShell"
              kind: "command"
              prompt: "PS>"
              command: "irm https://download.crystallattice.dev/crystal-lattice-cli/install.ps1 | iex"
              support: "Windows x64 or ARM64 · No admin rights, Python, Git Bash, or WSL needed"
              documentation:
                label: "Installation guide"
                href: "$docsUrl/packages/application-python/installation/"
            - id: "manual"
              tabLabel: "Manual"
              panelLabel: "Manual download"
              kind: "manual"
              description: >-
                Download an immutable release archive to inspect it, launch it
                directly, or install the command yourself.
              platforms:
                - "macOS Intel"
                - "macOS Apple silicon"
                - "Linux x64"
                - "Linux ARM64"
                - "Windows x64"
                - "Windows ARM64"
              download:
                label: "Open latest downloads"
                href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice/releases/latest"
                target: "_blank"
              documentation:
                label: "Manual installation guide"
                href: "$docsUrl/packages/application-python/installation/"
      - id: "start-workspace"
        kind: "command"
        title: "Start a workspace"
        description: >-
          Run Crystal Lattice in the project directory where you want the agent
          to work, expose the local server, and enable same-network discovery.
        reviewStatus: "Structure approved · copy draft"
        code: |
          $ mkdir -p ~/crystal-lattice-demo
          $ cd ~/crystal-lattice-demo

          $ crystal-lattice \
              --server \
              --console \
              --config-local \
              --host 0.0.0.0 \
              --port 9000 \
              --enable-bonjour
      - id: "download-desktop"
        kind: "desktop-download"
        title: "Download Crystal Lattice Desktop"
        description: >-
          Install the app UI after the CLI runtime is available. The current
          macOS DMG contains the app only and does not install or launch the CLI.
        reviewStatus: "Structure approved · copy draft"
        platforms:
          - id: "macos"
            label: "macOS"
            status: "available"
            detail: "Universal Apple silicon and Intel build for macOS 14 or later."
          - id: "windows"
            label: "Windows Desktop"
            status: "coming-soon"
            detail: "Desktop application package is not available yet."
          - id: "linux"
            label: "Linux Desktop"
            status: "coming-soon"
            detail: "Desktop application package is not available yet."
      - id: "connect-desktop"
        kind: "desktop-connect"
        title: "Connect Desktop to the workspace"
        description: >-
          Desktop uses the local computer by default. Enter the same port used
          when starting the CLI runtime.
        reviewStatus: "Structure approved · proof needed"
        methods:
          - title: "Enter the port"
            description: "The host defaults to 127.0.0.1. For the command above, enter port 9000."
            code: "9000"
        media:
          kind: "Desktop connection proof"
          status: "placeholder-needed"
          desktop: "Desktop connection editor with the default local host and the port field set to 9000."
      - id: "get-mobile"
        kind: "mobile-download"
        title: "Get the mobile app"
        description: >-
          Public App Store and Google Play distribution are planned. The
          working waitlist form will be added only after its AWS service is
          deployed and reviewed.
        reviewStatus: "Structure approved · form deferred"
        platforms:
          - id: "ios"
            label: "App Store"
            status: "coming-soon"
            detail: "Public iOS distribution is not available yet."
          - id: "android"
            label: "Google Play"
            status: "coming-soon"
            detail: "Public Android distribution is not available yet."
        waitlist:
          label: "Join the mobile release waitlist"
          status: "disabled-prototype"
          note: "No email is collected in this structural prototype."
      - id: "connect-mobile"
        kind: "mobile-connect"
        title: "Connect from mobile"
        description: >-
          Use the same runtime sessions from a phone through a manual address,
          automatic local discovery, or a self-hosted bridge.
        reviewStatus: "Structure approved · proof needed"
        methods:
          - title: "Manual address"
            description: "Enter the runtime's local HTTP address when you already know it."
            code: "http://192.168.1.42:9000"
          - title: "Automatic discovery"
            description: "Find the runtime automatically while both devices are on the same network."
            code: "crystal-lattice ... --enable-bonjour"
          - title: "Bridge pairing"
            description: "Use a reachable self-hosted bridge when the phone is outside the local network."
            code: "crystal-lattice ... --bridge-url wss://<bridge>/ws/websocket"
        media:
          kind: "Mobile connection proof"
          status: "placeholder-needed"
          desktop: "Reviewed mobile connection and active-session composition required."

  - type: providers
    id: harness-strip
    label: "Built-in model-family harnesses"
    providers:
      - "Codex-style tools"
      - "Claude-style workflows"
      - "Gemini-oriented tools"
      - "Qwen-oriented tools"
      - "Kimi-oriented tools"
      - "Grok-oriented tools"

  - type: actionGuide
    id: bridge
    eyebrow: "Outside your local network"
    title: "Pair through a self-hosted bridge"
    body:
      - >-
        Hosted bridge service is coming soon. Today, when your phone is not on
        the same network as your computer, deploy your own bridge and pair
        through it.
      - >-
        The bridge gives Crystal Lattice clients a way to reconnect from outside
        the local network. Local bridge hosting is useful for development and
        testing, but production use should deploy the bridge somewhere reachable.
    action:
      title: "Deploy the bridge on AWS"
      steps:
        - label: "Create the bridge deployment"
          code: |
            ALLOW_AWS_DEPLOY=1 deploy/aws-ec2/build.sh \
              --profile secure \
              --stack-name crystal-lattice-bridge \
              --region us-east-1

            ALLOW_AWS_DEPLOY=1 deploy/aws-ec2/up.sh \
              --profile secure \
              --stack-name crystal-lattice-bridge \
              --region us-east-1
        - label: "Start Crystal Lattice with the bridge URL"
          code: |
            crystal-lattice \
              --server \
              --console \
              --config-local \
              --host 0.0.0.0 \
              --port 9000 \
              --bridge-url wss://<your-cloudfront-domain>/ws/websocket
        - label: "Pair from the phone"
          text: "Open Crystal Lattice Control, choose Bridge Service, enter the bridge URL, select your computer, and enter the pairing code."

  - type: featureMatrix
    id: model-native-harnesses
    eyebrow: "Model-native harnesses"
    title: "Stop forcing every model through the same prompt and tools."
    intro: >-
      Model-native means Crystal Lattice changes the harness around the model:
      system message, tool schema, request behavior, provider-native state, and
      UI controls. The built-in defaults do this with plugins, and those plugins
      can be replaced.
    columns:
      - key: "modelFamily"
        label: "Model family"
      - key: "builtInHarness"
        label: "Built-in harness"
      - key: "whatChanges"
        label: "What changes"
    rows:
      - modelFamily: "Codex / GPT coding models"
        builtInHarness: "`codex-tools`"
        whatChanges: "Codex-style shell tools, apply patch semantics, skills block, model-family system instructions."
      - modelFamily: "Claude"
        builtInHarness: "`claude-tools`"
        whatChanges: "Claude-oriented tool schema and workflow conventions."
      - modelFamily: "Gemini"
        builtInHarness: "`gemini-tools` + compaction plugins"
        whatChanges: "Gemini-oriented system message and tool behavior, optional compaction flow."
      - modelFamily: "Qwen"
        builtInHarness: "`qwen-tools`"
        whatChanges: "Qwen-oriented tool and instruction style."
      - modelFamily: "Kimi"
        builtInHarness: "`kimi-tools`"
        whatChanges: "Kimi-oriented tools and prompt behavior."
      - modelFamily: "Grok"
        builtInHarness: "`grok-tools`"
        whatChanges: "Grok-oriented tools and request behavior."
      - modelFamily: "OpenAI Responses"
        builtInHarness: "`openai_responses`"
        whatChanges: "Responses-native reasoning, usage/cost metadata, attachments, prompt caching, native compaction."
      - modelFamily: "OpenRouter"
        builtInHarness: "`openrouter`"
        whatChanges: "OpenRouter model routing, reasoning/web/image extensions depending on provider path."

  - type: featureShowcase
    id: native-provider-features
    eyebrow: "Native provider features"
    title: "Provider-specific behavior can become real UI."
    body:
      - >-
        Some capabilities are not generic chat settings. Reasoning effort,
        verbosity, usage, token counts, cache information, duration, and cost
        metadata depend on the provider path.
      - >-
        Crystal Lattice lets provider and feature plugins expose those controls
        and outputs directly to the UI, so native behavior is visible instead of
        hidden behind a generic wrapper.
    items:
      - title: "Reasoning and verbosity"
        description: "Expose plugin-driven model controls when the provider supports them. Easily adjust which controls your use case needs."
        media:
          kind: "screenshot"
          src: "/provider-reasoning.webp"
          srcDark: "/provider-reasoning-dark.webp"
          alt: "Session settings with magnified medium reasoning effort and medium verbosity controls."
          width: 1000
          height: 1315
      - title: "Usage and cost transparency"
        description: "Surface plugin-driven token, cache, duration, and cost metadata. Easily adjust the information shown for your use case."
        media:
          kind: "screenshot"
          src: "/provider-usage-cost.webp"
          srcDark: "/provider-usage-cost-dark.webp"
          alt: "A completed coding-plan response with magnified input, estimated cached, completion, reasoning-token, and estimated-cost metadata."
          width: 940
          height: 1334

  - type: promptBlock
    id: build-plugin
    eyebrow: "Plugin authoring"
    title: "Ask an agent to plan the plugin."
    intro: >-
      A user-owned plugin workflow still needs product polish, but the design
      goal is straightforward: inspect the docs, pick the right plugin type,
      copy the closest template, write tests, and load the plugin from config.
    prompt: |
      I want to build a Crystal Lattice plugin.

      Please inspect the plugin documentation in this repository, especially:
      - plugins/docs/index.md
      - plugins/docs/tool-plugins.md
      - plugins/docs/application-plugins.md
      - plugins/docs/provider-plugins.md
      - plugins/docs/provider-extensions.md
      - plugins/docs/feature-plugins.md
      - plugins/docs/ui-elements.md
      - plugins/docs/plugin-packaging-and-loading.md

      Goal:
      Create a plugin that [describe what I want].

      Please:
      1. Identify whether this should be a provider, provider extension, feature, tool, or application plugin.
      2. Find the closest existing plugin or template to copy from.
      3. Explain what UI, if any, the plugin should expose.
      4. Propose the file layout.
      5. Draft an implementation plan.
      6. Tell me what tests should be added before coding.
    configExample:
      language: "json"
      code: |
        {
          "plugins": [
            "path:./plugins/my-custom-plugin"
          ]
        }

  - type: codeExample
    id: automate-python
    eyebrow: "Python SDK"
    title: "Automate the same harness with Python."
    body:
      - >-
        When the work becomes repetitive, use the same configured agents and
        plugins from Python. The example below sketches a short sales-letter
        workflow over a CSV of leads.
      - >-
        The final webpage should verify this against the current SDK and may
        add a small helper if the public API needs a simpler "run until final"
        path.
    code:
      language: "python"
      status: "sdk-api-needs-verification"
      value: |
        import pandas as pd
        from agent_app import AgentApplication

        app = AgentApplication.from_config("./.crystal/config.json")
        leads = pd.read_csv("leads.csv")

        def draft(row):
            session = app.create_session(agent_id="codex-openrouter")
            app.add_message(
                session.session_id,
                "user",
                f"""
                Write a concise first sales email.

                Name: {row.name}
                Role: {row.role}
                Company: {row.company}
                Notes: {row.notes}
                """,
            )
            result = app.run_until_final(session.session_id)
            return result.content

        leads["draft"] = leads.apply(draft, axis=1)
        leads.to_csv("drafts.csv", index=False)

  - type: cta
    title: "Use the harness you can inspect and replace."
    body: >-
      Start with built-in model-family plugins, run Crystal Lattice on your
      computer, continue from phone or app UI, and replace the parts of the
      harness your workflow disagrees with.
    actions:
      - label: "Install the CLI"
        href: "#getting-started"
        variant: primary
        icon: arrow
      - label: "Mobile apps coming soon"
        href: "/mobile"
        variant: outline
      - label: "View on GitHub"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
        variant: outline
        icon: github
        target: "_blank"
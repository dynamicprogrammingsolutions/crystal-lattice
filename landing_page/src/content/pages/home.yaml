seo:
  title: "Crystal Lattice: The Open Source AI Agent Platform"
  description: >-
    A local-first, provider-agnostic AI agent platform. Terminal & HTTP server,
    mobile app, plugin ecosystem, and Python SDK. All on your own hardware.

sections:
  - type: hero
    id: hero
    badge: "Open Source  ·  Apache 2.0"
    titleHtml: 'The open source<br /><span class="highlight">AI agent platform</span>'
    subtitle: >-
      Crystal Lattice is a local-first, provider-agnostic AI agent platform.
      Terminal & HTTP server, iOS & Android mobile app, deep plugin system, and
      a Python SDK. Everything runs on your own hardware, with your own models,
      and your own data.
    actions:
      - label: "Get started"
        href: "#quickstart"
        variant: primary
        icon: arrow
      - label: "View on GitHub"
        href: "#"
        variant: outline
        icon: github
        target: "_blank"
    install:
      prompt: "$"
      command: "curl -fsSL https://crystal-lattice-downloads-874087778966.s3.us-east-1.\
        amazonaws.com/crystal-lattice-cli/install.sh | bash"
      altHtml: "or <code>pipx install crystal-lattice-cli</code>"

  - type: providers
    label: "Works with"
    providers:
      - "OpenAI"
      - "Anthropic"
      - "Google Gemini"
      - "OpenRouter"
      - "Ollama"
      - "Any OpenAI-compatible API"

  - type: features
    id: features
    source: "../markdown/home-features.md"

  - type: quickstart
    id: quickstart
    eyebrow: "Quickstart"
    title: "Up and running in two minutes"
    body: "Install the CLI, start the server, connect your phone."
    steps:
      - num: "1"
        title: "Install"
        body:
          - html: "One-line installer for macOS & Linux:"
        codeBlocks:
          - "curl -fsSL https://crystal-lattice-downloads-874087778966.s3.us-east-1.\
            amazonaws.com/crystal-lattice-cli/install.sh | bash"
        after:
          - html: "Or via pipx:"
        afterCodeBlocks:
          - "pipx install crystal-lattice-cli"
      - num: "2"
        title: "Start the server"
        body:
          - html: "Create a working directory and launch:"
        codeBlocks:
          - |
            mkdir ~/crystal-lattice && cd ~/crystal-lattice

            crystal-lattice \
              --server \
              --console \
              --config-local \
              --host 0.0.0.0 \
              --port 9000
        after:
          - html: "Add a provider key to <code>.crystal/config.json</code> to enable model calls."
      - num: "3"
        title: "Connect your phone"
        body:
          - html: "Find your LAN IP:"
        codeBlocks:
          - |
            hostname -I              # Linux
            ipconfig getifaddr en0   # macOS
        after:
          - html: "In the app: <strong>Manual Address → &lt;IP&gt;:9000 → Connect</strong>"
          - html: "Or launch with <code>--enable-bonjour</code> for zero-config auto-discovery."

  - type: cta
    title: "Start running your own AI platform"
    body: >-
      Crystal Lattice is free and open source under the Apache 2.0 license.
      Install the CLI, start the server, and have your first agent session
      running in minutes.
    actions:
      - label: "Install the CLI"
        href: "#quickstart"
        variant: primary
        icon: arrow
      - label: "Read the docs"
        href: "#"
        variant: outline
        target: "_blank"
      - label: "View on GitHub"
        href: "#"
        variant: outline
        icon: github
        target: "_blank"

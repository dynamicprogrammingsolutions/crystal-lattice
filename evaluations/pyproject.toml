[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evaluations"
version = "0.1.0"
description = "Agentic benchmark runners for the AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Agent Platform Team"}
]
dependencies = [
    "agent-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.scripts]
agent-evaluations = "agent_evaluations.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_evaluations*"]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests that may hit real services",
    "openai: tests requiring OpenAI credentials",
]

AWSTemplateFormatVersion: "2010-09-09"
Description: Crystal Lattice cloud orchestrator generated CloudFront edge.

Parameters:
  StackName:
    Type: String
  OriginDomainName:
    Type: String

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${StackName} cloud orchestrator
        Origins:
          - Id: ec2-origin
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPPort: 4100
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: false
          ForwardedValues:
            QueryString: true
            Headers:
              - Authorization
              - Content-Type
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref Distribution
  CloudOrchestratorUrl:
    Value: !Sub https://${Distribution.DomainName}
version: "3.8"

services:
  orchestrator:
    build: .
    container_name: cloud-orchestrator-single
    environment:
      MIX_ENV: prod
      PORT: "4100"
      CLOUD_ORCHESTRATOR_PUBLIC_URL: "${CLOUD_ORCHESTRATOR_PUBLIC_URL:-http://127.0.0.1:4100}"
      CLOUD_ORCHESTRATOR_TOKEN_SECRET: "${CLOUD_ORCHESTRATOR_TOKEN_SECRET:-change-this-token-secret}"
      CLOUD_ORCHESTRATOR_CONTROL_TOKEN: "${CLOUD_ORCHESTRATOR_CONTROL_TOKEN:-}"
      CLOUD_ORCHESTRATOR_RUNNER: "${CLOUD_ORCHESTRATOR_RUNNER:-docker}"
      CLOUD_ORCHESTRATOR_DOCKER_PROXY_HOST: "${CLOUD_ORCHESTRATOR_DOCKER_PROXY_HOST:-host.docker.internal}"
      CLOUD_ORCHESTRATOR_DOCKER_BIND_HOST: "${CLOUD_ORCHESTRATOR_DOCKER_BIND_HOST:-127.0.0.1}"
      CLOUD_ORCHESTRATOR_RUNTIME_READY_TIMEOUT_MS: "${CLOUD_ORCHESTRATOR_RUNTIME_READY_TIMEOUT_MS:-1800000}"
      CLOUD_ORCHESTRATOR_DATA_DIR: "/var/lib/cloud-orchestrator"
      CLOUD_ORCHESTRATOR_HOST_DATA_DIR: "${CLOUD_ORCHESTRATOR_HOST_DATA_DIR:-/var/lib/cloud-orchestrator}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:-change-this-secret-key-base-change-this-secret-key-base-1234}"
      TRANSFER_PORT_START: "${TRANSFER_PORT_START:-22000}"
      TRANSFER_PORT_END: "${TRANSFER_PORT_END:-22099}"
    ports:
      - "${CLOUD_ORCHESTRATOR_PORT:-4100}:4100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CLOUD_ORCHESTRATOR_HOST_DATA_DIR:-/var/lib/cloud-orchestrator}:/var/lib/cloud-orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway"
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Isolated Crystal Lattice staging website hosting with a private S3 origin,
  CloudFront Origin Access Control, ACM, Route 53, and no-index response
  headers.

Parameters:
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for crystallattice.dev.
  DomainName:
    Type: String
    Default: staging.crystallattice.dev
    Description: Fully qualified staging website domain.
  BucketNamePrefix:
    Type: String
    Default: crystal-lattice-staging
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,45}[a-z0-9]$"
    Description: Lowercase S3 bucket prefix. Account ID is appended.

Mappings:
  CloudFront:
    HostedZone:
      Id: Z2FDTNDATAQYW2

Resources:
  StagingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${BucketNamePrefix}-site-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: crystal-lattice
        - Key: Component
          Value: staging-site

  StagingOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-staging-s3-oac"
        Description: !Sub "OAC for ${DomainName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StagingCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: crystal-lattice
        - Key: Component
          Value: staging-site

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-html-cache"
        Comment: Short cache policy for staging HTML and directory indexes.
        DefaultTTL: 300
        MaxTTL: 3600
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  AssetCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-asset-cache"
        Comment: Long cache policy for fingerprinted staging assets.
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  StagingResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-response-headers"
        Comment: Security and no-index headers for the public staging site.
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: "noindex, nofollow, noarchive, nosnippet"
              Override: true
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-directory-index-routing"
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite staging directory URLs to nested index.html files.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
            return request;
          }

          var lastSegment = uri.substring(uri.lastIndexOf('/') + 1);
          if (lastSegment.indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }

          return request;
        }

  StagingDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Comment: !Sub "Crystal Lattice staging site - ${DomainName}"
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: staging-s3-origin
            DomainName: !GetAtt StagingBucket.RegionalDomainName
            OriginAccessControlId: !Ref StagingOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref HtmlCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
          ResponseHeadersPolicyId: !Ref StagingResponseHeadersPolicy
          TargetOriginId: staging-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - PathPattern: /_astro/*
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref AssetCachePolicy
            Compress: true
            ResponseHeadersPolicyId: !Ref StagingResponseHeadersPolicy
            TargetOriginId: staging-s3-origin
            ViewerProtocolPolicy: redirect-to-https
        ViewerCertificate:
          AcmCertificateArn: !Ref StagingCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StagingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${StagingBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${StagingDistribution}"

  StagingAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt StagingDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: !FindInMap [CloudFront, HostedZone, Id]

  StagingAliasIpv6Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt StagingDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: !FindInMap [CloudFront, HostedZone, Id]

Outputs:
  StagingBucket:
    Description: S3 bucket for staging website artifacts.
    Value: !Ref StagingBucket
  StagingCloudFrontDistributionId:
    Description: CloudFront distribution ID for the staging website.
    Value: !Ref StagingDistribution
  StagingCloudFrontDomainName:
    Description: CloudFront-generated staging domain.
    Value: !GetAtt StagingDistribution.DomainName
  StagingUrl:
    Description: Public staging website URL.
    Value: !Sub "https://${DomainName}"
  CertificateArn:
    Description: ACM certificate for the staging alias.
    Value: !Ref StagingCertificate
  ResponseHeadersPolicyId:
    Description: CloudFront response-header policy with X-Robots-Tag.
    Value: !Ref StagingResponseHeadersPolicy
  HostedZoneId:
    Description: Route 53 hosted zone used for validation and aliases.
    Value: !Ref HostedZoneId
  AwsRegion:
    Description: Region used for this stack.
    Value: !Ref AWS::Region
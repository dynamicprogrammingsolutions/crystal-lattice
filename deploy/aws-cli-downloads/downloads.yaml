AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Crystal Lattice CLI download hosting with a private S3 origin, CloudFront
  Origin Access Control, ACM, and Route 53.

Parameters:
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID for the download domain.
  DownloadDomainName:
    Type: String
    Default: download.crystallattice.dev.dynamicprogrammingsolutions.com
    Description: Fully qualified domain name for CLI downloads.
  BucketNamePrefix:
    Type: String
    Default: crystal-lattice-cli-downloads-test
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,45}[a-z0-9]$"
    Description: Lowercase S3 bucket name prefix. Account ID is appended.
  DownloadPrefix:
    Type: String
    Default: crystal-lattice-cli
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*[A-Za-z0-9]$"
    Description: URL/S3 prefix under the download domain.
  DesktopDownloadPrefix:
    Type: String
    Default: crystal-lattice-desktop
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*[A-Za-z0-9]$"
    Description: URL/S3 prefix for Crystal Lattice Desktop downloads.

Mappings:
  CloudFront:
    HostedZone:
      Id: Z2FDTNDATAQYW2

Resources:
  DownloadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketNamePrefix}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: crystal-lattice
        - Key: Component
          Value: cli-downloads

  DownloadsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-cli-downloads-s3-oac"
        Description: !Sub "OAC for ${DownloadDomainName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DownloadsCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DownloadDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DownloadDomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: crystal-lattice
        - Key: Component
          Value: cli-downloads

  InstallerCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-installer-cache"
        Comment: Short cache policy for installer and latest marker files.
        DefaultTTL: 60
        MaxTTL: 300
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  ArchiveCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-archive-cache"
        Comment: Long cache policy for immutable versioned release archives.
        DefaultTTL: 31536000
        MaxTTL: 31536000
        MinTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Conservative security headers for Crystal Lattice CLI downloads.
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Preload: false
            Override: true
          XSSProtection:
            ModeBlock: true
            Override: true
            Protection: true

  DownloadsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DownloadDomainName
        Comment: !Sub "Crystal Lattice CLI downloads - ${DownloadDomainName}"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: cli-downloads-s3-origin
            DomainName: !GetAtt DownloadsBucket.RegionalDomainName
            OriginAccessControlId: !Ref DownloadsOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: !Ref InstallerCachePolicy
          Compress: true
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          TargetOriginId: cli-downloads-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - PathPattern: !Sub "${DownloadPrefix}/*.tar.gz"
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ArchiveCachePolicy
            Compress: false
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: cli-downloads-s3-origin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: !Sub "${DownloadPrefix}/*.zip"
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ArchiveCachePolicy
            Compress: false
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: cli-downloads-s3-origin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: !Sub "${DesktopDownloadPrefix}/*.dmg"
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ArchiveCachePolicy
            Compress: false
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: cli-downloads-s3-origin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: !Sub "${DesktopDownloadPrefix}/*.sha256"
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ArchiveCachePolicy
            Compress: true
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: cli-downloads-s3-origin
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: !Sub "${DesktopDownloadPrefix}/*.json"
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachePolicyId: !Ref ArchiveCachePolicy
            Compress: true
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            TargetOriginId: cli-downloads-s3-origin
            ViewerProtocolPolicy: redirect-to-https
        ViewerCertificate:
          AcmCertificateArn: !Ref DownloadsCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  DownloadsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DownloadsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${DownloadsBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DownloadsDistribution}"

  DownloadAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DownloadDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DownloadsDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: !FindInMap [CloudFront, HostedZone, Id]

  DownloadAliasIpv6Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DownloadDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt DownloadsDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: !FindInMap [CloudFront, HostedZone, Id]

Outputs:
  DownloadsBucket:
    Description: S3 bucket for CLI download artifacts.
    Value: !Ref DownloadsBucket
  DownloadsPrefix:
    Description: S3/URL prefix for CLI downloads.
    Value: !Ref DownloadPrefix
  DownloadsBaseUrl:
    Description: Public base URL containing install.sh, latest.txt, and archives.
    Value: !Sub "https://${DownloadDomainName}/${DownloadPrefix}"
  DesktopDownloadsPrefix:
    Description: S3/URL prefix for Crystal Lattice Desktop downloads.
    Value: !Ref DesktopDownloadPrefix
  DesktopDownloadsBaseUrl:
    Description: Public base URL for Crystal Lattice Desktop downloads.
    Value: !Sub "https://${DownloadDomainName}/${DesktopDownloadPrefix}"
  DownloadsCloudFrontDistributionId:
    Description: CloudFront distribution ID for CLI downloads.
    Value: !Ref DownloadsDistribution
  DownloadsCloudFrontDomainName:
    Description: CloudFront generated domain for CLI downloads.
    Value: !GetAtt DownloadsDistribution.DomainName
  DownloadDomainName:
    Description: Configured CLI download domain.
    Value: !Ref DownloadDomainName
  CertificateArn:
    Description: ACM certificate ARN used by the CloudFront distribution.
    Value: !Ref DownloadsCertificate
  HostedZoneId:
    Description: Route 53 hosted zone ID used for validation and aliases.
    Value: !Ref HostedZoneId
  AwsRegion:
    Description: Region used for this CloudFormation stack.
    Value: !Ref AWS::Region
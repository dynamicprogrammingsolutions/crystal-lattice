site_name: Crystal Lattice Docs
site_description: Plugin-driven AI agent platform documentation
site_url: !ENV [PUBLIC_CRYSTAL_LATTICE_DOCS_URL, "https://docs.crystallattice.dev/"]
repo_url: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
repo_name: GitHub
use_directory_urls: true
docs_dir: prepared
site_dir: dist

extra:
  crystal_lattice:
    site_url: !ENV [PUBLIC_CRYSTAL_LATTICE_SITE_URL, "https://crystallattice.dev"]
    docs_url: !ENV [PUBLIC_CRYSTAL_LATTICE_DOCS_URL, "https://docs.crystallattice.dev"]

theme:
  name: material
  custom_dir: overrides
  logo: assets/brand/icon_dark.svg
  favicon: assets/brand/icon.svg
  icon:
    repo: crystal-lattice/github
  features:
    - navigation.sections
    - navigation.tabs
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: crystal-lattice/sun
        name: Switch to light mode
    - scheme: default
      primary: white
      accent: blue
      toggle:
        icon: crystal-lattice/moon
        name: Switch to dark mode

extra_css:
  - assets/styles/crystal-lattice.css

extra_javascript:
  - assets/javascripts/llm-actions.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Add the core package path so imports resolve during builds
          paths:
            - ..
            - ../core/python
          options:
            docstring_style: google
            show_source: true
            separate_signature: true
            merge_init_into_class: true
            inherited_members: false
            members_order: alphabetical
  - llmstxt:
      markdown_description: >-
        Crystal Lattice is a plugin-driven AI agent platform with a Python SDK,
        terminal and HTTP runtime, mobile and desktop clients, provider
        integrations, and first-party plugin packages.
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md: Crystal Lattice documentation overview.
        Development Specifications:
          - development/index.md: Cross-package development specifications.
          - development/specifications/notifications/index.md: Notification specification.
          - development/specifications/notifications/technical-spec.md: Notification technical contract.
          - development/specifications/notifications/frontend-behavior.md: Portable notification frontend behavior.
          - development/specifications/action-display/index.md: Action-display specification.
          - development/specifications/application-runtime-reload/index.md: Application runtime reload specification.
          - development/specifications/sessions-actions/index.md: Sessions-action specification.
          - development/specifications/bridge-connectivity/index.md: Bridge-connectivity specification.
          - development/specifications/bridge-connectivity/technical-spec.md: Bridge-connectivity technical contract.
          - development/specifications/bridge-connectivity/protocol.md: Bridge-connectivity wire protocol.
        Guides:
          - plugins/development.md: General plugin authoring and packaging guide.
          - plugins/application-config.md: Application plugin configuration and examples.
        Current Plugin Docs:
          - plugin-development/index.md: Current plugin documentation entry point.
          - plugin-development/provider-plugins.md: Provider plugin guide.
          - plugin-development/provider-extensions.md: Provider extension guide.
          - plugin-development/feature-plugins.md: Feature plugin guide.
          - plugin-development/application-plugins.md: Application plugin guide.
          - plugin-development/managed-background-processes.md: Managed background process guide.
          - plugin-development/tool-plugins.md: Tool plugin guide.
          - plugin-development/tool-interop.md: Tool interop flow.
          - plugin-development/node-tool-plugins.md: Node tool plugin guide.
          - plugin-development/bash-tool-plugins.md: Bash tool plugin guide.
          - plugin-development/actions.md: Plugin actions guide.
          - plugin-development/notifications-and-action-displays.md: Notification and action-display authoring guide.
          - plugin-development/plugin-packaging-and-loading.md: Packaging and loading guide.
          - plugin-development/plugin-execution-order.md: Plugin execution order.
          - plugin-development/config-schema.md: Plugin configuration schema guide.
          - plugin-development/ui-elements.md: Plugin UI elements guide.
          - plugin-development/testing-and-validation.md: Testing and validation guide.
          - plugin-development/specialized-task-agents.md: Specialized task agents guide.
        Built-In Plugins:
          - built-in-plugins/index.md: Generated index of built-in plugin README pages.
          - built-in-plugins/*/index.md
        Reference:
          - api/core-sdk.md: Core SDK guide.
          - api/events.md: Event stream types and API transport notes.
          - reference/agent_core/core.md: AgentCore API reference.
          - reference/agent_core/types.md: Core types and protocols reference.
          - reference/agent_core/plugin/provider.md: Provider wrapper API reference.
          - reference/providers/openai_provider.md: OpenAI-compatible provider reference.
          - reference/tool-host-protocol.md: Tool host protocol reference.
          - reference/default-config.md: Generated default application configuration reference.


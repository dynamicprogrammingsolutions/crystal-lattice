[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "message-export-actions"
version = "0.1.0"
description = "Application plugins for exporting individual messages to Kindle or PDF"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "markdown>=3.6",
  "xhtml2pdf>=0.2.17"
]


[project.optional-dependencies]
dev = [
  "agent-core>=0.3.0",
  "pytest>=7.0.0"
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["message_export_actions*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
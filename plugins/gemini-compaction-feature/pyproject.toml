[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-compaction-feature"
version = "0.1.0"
description = "Gemini-style compaction feature plugin for AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gemini-compaction-app>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "python-dotenv>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_compaction_feature"]

[tool.hatch.build.targets.sdist]
include = ["src/gemini_compaction_feature"]

[tool.setuptools.data-files]
"" = ["agent_plugin.json"]

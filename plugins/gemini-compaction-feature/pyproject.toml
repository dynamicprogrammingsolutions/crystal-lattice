[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-compaction-feature"
version = "0.1.0"
description = "Gemini-style compaction feature plugin for AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "python-dotenv>=1.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gemini_compaction_feature*"]

[tool.setuptools.data-files]
"" = ["agent_plugin.json"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "chatgpt-auth-app"
version = "0.1.0"
description = "Application plugin for minimal ChatGPT device login"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "certifi>=2024.2.2",
  "requests>=2.0.0",
]


[project.optional-dependencies]
dev = [
  "agent-core>=0.3.0",
  "pytest>=7.0.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["chatgpt_auth_app*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "integration: integration tests that call real services",
  "openai: tests requiring OpenAI credentials",
  "manual_integration: semiautomated tests requiring a human to complete login",
]
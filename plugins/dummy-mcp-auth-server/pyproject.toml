[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "dummy-mcp-auth-server"
version = "0.1.0"
description = "Local OAuth-protected MCP server for manual Crystal Lattice testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "uvicorn>=0.20.0",
]


[project.scripts]
dummy-mcp-auth-server = "dummy_mcp_auth_server.__main__:main"


[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["dummy_mcp_auth_server*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
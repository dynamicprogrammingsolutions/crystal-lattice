[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mcp-runtime-app"
version = "0.1.0"
description = "Application plugin for MCP runtime observability and control"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]


[project.optional-dependencies]
dev = ["pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_runtime_app*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "reference-openai-compatible-provider"
version = "0.1.0"
description = "Reference OpenAI-compatible provider + extensions for the AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.0.0",
]


[project.optional-dependencies]
dev = [
  "agent-core>=0.3.0",
  "pytest>=7.0.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["reference_openai_compatible_provider*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "integration: integration tests that may hit real services",
  "fireworks: tests exercising hosted Fireworks integration",
  "zai: tests exercising hosted Z.ai integration",
  "ollama: tests exercising local Ollama integration",
]
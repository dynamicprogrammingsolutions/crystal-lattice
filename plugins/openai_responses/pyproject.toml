[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "openai_responses"
version = "0.1.0"
description = "OpenAI /responses provider + extensions for the AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "agent-core>=0.3.0",
  "openai>=2.0.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["openai_responses_plugins*"]

[tool.setuptools.package-data]
openai_responses_plugins = ["data/*.json"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "integration: integration tests that call real services",
  "openai: tests requiring OpenAI credentials",
]

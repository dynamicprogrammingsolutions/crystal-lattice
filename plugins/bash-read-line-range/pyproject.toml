[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "bash-read-line-range"
version = "0.1.0"
description = "Bash tool plugin: read a line range with optional line numbers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[project.optional-dependencies]
dev = ["agent-core>=0.3.0", "pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["bash_read_line_range*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json", "read_line_range.bash"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

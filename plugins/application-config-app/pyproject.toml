[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "application-config-app"
version = "0.1.0"
description = "Application actions for full reload and allowlisted dotenv credentials."
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
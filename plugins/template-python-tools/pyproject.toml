[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "template-python-tools"
version = "0.1.0"
description = "Template Python tool plugin repo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[project.optional-dependencies]
dev = ["agent-core>=0.3.0", "pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["template_python_tools*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

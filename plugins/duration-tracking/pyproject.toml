[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "duration-tracking"
version = "0.1.0"
description = "Duration tracking plugin with a SQLite store, session totals, and status-bar elements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]


[project.optional-dependencies]
dev = [
  "agent-core>=0.3.0",
  "pytest>=7.0.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["duration_tracking_plugins*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: integration tests that call real services",
]
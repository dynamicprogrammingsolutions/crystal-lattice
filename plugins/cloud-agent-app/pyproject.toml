[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-agent-app"
version = "0.1.0"
description = "Cloud agent application plugin and managed SSH transfer adapter."
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cloud_agent_app = [
    "managed_ssh_rsync.sh",
    "bundled_runtime/python/Dockerfile",
    "bundled_runtime/python/runtime.py",
]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "skill-shared"
version = "0.1.0"
description = "Shared discovery and parsing helpers for vendor skill packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]


[project.optional-dependencies]
dev = ["pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["skill_shared*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
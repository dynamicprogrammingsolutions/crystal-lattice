[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-compaction-app"
version = "0.1.0"
description = "Gemini-style compaction application plugin for AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_compaction_app"]

[tool.hatch.build.targets.sdist]
include = ["src/gemini_compaction_app"]
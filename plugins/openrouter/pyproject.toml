[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "openrouter-plugins"
version = "0.1.0"
description = "OpenRouter provider + extensions for the AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.0.0"
]


[project.optional-dependencies]
dev = [
  "agent-core>=0.3.0",
  "pytest>=7.0.0",
  "python-dotenv>=1.0.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["openrouter_plugins*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not integration'"
markers = [
  "integration: integration tests that call real services",
  "provider_integration: direct provider/extension integration tests eligible for preinstalled-bundle validation",
  "api: hosted API integration tests requiring credentials and potentially incurring cost",
  "slow_integration: slow integration tests that should be run selectively",
  "openrouter: tests requiring OpenRouter",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "openrouter-plugins"
version = "0.1.0"
description = "OpenRouter provider + extensions for the AI Agent Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.0.0"]


[tool.setuptools]
packages = ["openrouter_plugins"]


[tool.setuptools.package-data]
openrouter_plugins = ["agent_plugin.json"]

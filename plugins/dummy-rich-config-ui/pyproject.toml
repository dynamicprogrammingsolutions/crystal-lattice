[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dummy-rich-config-ui"
version = "0.1.0"
description = "Manual and automated test plugin for portable rich configuration UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "agent-core>=0.3.0",
  "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dummy_rich_config_ui*"]

[tool.setuptools.data-files]
"" = ["agent_plugin.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
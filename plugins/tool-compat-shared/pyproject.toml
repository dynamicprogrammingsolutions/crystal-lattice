[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "tool-compat-shared"
version = "0.1.0"
description = "Shared helpers for vendor-style filesystem tool bundles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[project.optional-dependencies]
dev = ["pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["tool_compat_shared*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
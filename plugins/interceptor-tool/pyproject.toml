[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interceptor-tool"
version = "0.1.0"
description = "Tool plugin with interceptor prompt flow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["interceptor_tool_plugin*"]

[tool.setuptools.data-files]
"" = ["agent_plugin.json"]

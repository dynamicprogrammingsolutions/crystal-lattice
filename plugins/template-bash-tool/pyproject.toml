[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "template-bash-tool"
version = "0.1.0"
description = "Template bash tool plugin repo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []


[project.optional-dependencies]
dev = ["agent-core>=0.3.0", "pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["template_bash_tool*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json", "template_bash_echo.bash"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

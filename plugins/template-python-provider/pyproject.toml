[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "template-python-provider"
version = "0.1.0"
description = "Template Python provider plugin repo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["agent-core>=0.3.0"]


[project.optional-dependencies]
dev = ["pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["template_python_provider*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that may hit real services",
]

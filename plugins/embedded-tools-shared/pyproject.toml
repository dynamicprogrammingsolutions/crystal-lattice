[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "embedded-tools-shared"
version = "0.1.0"
description = "Pure-Python workspace engines for embedded model tool packages"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []


[project.optional-dependencies]
dev = ["pytest>=7.0.0"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["embedded_tools_shared*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
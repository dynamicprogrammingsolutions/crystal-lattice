[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "codex-tools"
version = "0.1.0"
description = "Codex tools plugin bundle (shell, apply_patch)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "AI Agent Platform Team"}
]
dynamic = ["dependencies"]


[project.optional-dependencies]
dev = [
  "agent-core>=0.3.0",
  "pytest>=7.0.0"
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["codex_tools*"]


[tool.setuptools.data-files]
"" = ["agent_plugin.json"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "integration: tests that call real provider APIs",
  "openai: tests that call OpenAI APIs",
  "openrouter: tests that call OpenRouter APIs",
]

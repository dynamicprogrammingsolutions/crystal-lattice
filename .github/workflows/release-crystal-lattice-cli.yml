name: Release crystal-lattice-cli

on:
  workflow_dispatch:
  push:
    tags:
      - "crystal-lattice-cli-v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e "core/python[dev]" -e application/python

      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          pyproject = Path("application/python/pyproject.toml")
          version = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]["version"]
          expected = f"crystal-lattice-cli-v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag must match application package version: "
                  f"expected {expected}, got {actual}"
              )
          PY

      - name: Run core tests
        run: pytest core/python/tests -q -m "not integration"

      - name: Run application tests
        run: pytest application/python/tests -q -m "not integration and not docker"

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            platform: linux
            arch: amd64
            python-request: "3.11"
            archive-glob: "*.tar.gz"
            bash-installer: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            python-request: "3.11"
            archive-glob: "*.tar.gz"
            bash-installer: true
          - target: darwin-amd64
            runner: macos-15-intel
            platform: darwin
            arch: amd64
            python-request: "3.11"
            archive-glob: "*.tar.gz"
            bash-installer: true
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            python-request: "3.11"
            archive-glob: "*.tar.gz"
            bash-installer: true
          - target: windows-amd64
            runner: windows-latest
            platform: windows
            arch: amd64
            python-request: "3.11"
            archive-glob: "*.zip"
            bash-installer: true
          - target: windows-arm64
            runner: windows-11-arm
            platform: windows
            arch: arm64
            python-request: "cpython-3.11-windows-aarch64-none"
            archive-glob: "*.zip"
            bash-installer: false
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Create repository Python environment
        run: npm run install:venv

      - name: Install build dependencies
        run: python -m pip install -e core/python -e "application/python[binary]"

      - name: Prepare relocatable Python runtime
        run: |
          python -m pip install uv
          uv python install \
            --install-dir "$RUNNER_TEMP/uv-python" \
            --python-preference only-managed \
            "${{ matrix.python-request }}"
          runtime_root="$(find "$RUNNER_TEMP/uv-python" -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          if [ -z "$runtime_root" ]; then
            echo "Could not locate uv-managed Python runtime" >&2
            exit 1
          fi
          echo "CRYSTAL_PYTHON_RUNTIME=$runtime_root" >> "$GITHUB_ENV"

      - name: Build bundled-Python runtime archive
        run: |
          python scripts/build_crystal_lattice_python_runtime_package.py \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --python-runtime "$CRYSTAL_PYTHON_RUNTIME"

      - name: Locate release archive
        id: locate_archive
        env:
          ARCHIVE_GLOB: ${{ matrix.archive-glob }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          archives = sorted(Path("dist/crystal-lattice-python-runtime").glob(os.environ["ARCHIVE_GLOB"]))
          archives = [path for path in archives if f"-{os.environ['TARGET']}." in path.name]
          if len(archives) != 1:
              found = "\n".join(str(path) for path in archives) or "<none>"
              raise SystemExit(f"Expected one archive for {os.environ['TARGET']}, found:\n{found}")

          archive = archives[0].as_posix()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"CRYSTAL_RELEASE_ARCHIVE={archive}\n")
          print(archive)
          PY

      - name: Smoke-test extracted archive
        env:
          CRYSTAL_LATTICE_PYTHON_RUNTIME_ARCHIVE: ${{ env.CRYSTAL_RELEASE_ARCHIVE }}
        run: npm run test:cli:archive

      - name: Smoke-test default installer
        if: ${{ always() && steps.locate_archive.outcome == 'success' && matrix.bash-installer }}
        env:
          CRYSTAL_LATTICE_PYTHON_RUNTIME_ARCHIVE: ${{ env.CRYSTAL_RELEASE_ARCHIVE }}
        run: npm run test:cli:default-install

      - name: Smoke-test PowerShell installer
        if: ${{ always() && steps.locate_archive.outcome == 'success' && matrix.platform == 'windows' }}
        env:
          CRYSTAL_LATTICE_PYTHON_RUNTIME_ARCHIVE: ${{ env.CRYSTAL_RELEASE_ARCHIVE }}
        run: npm run test:cli:powershell-install

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/crystal-lattice-cli-v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crystal-lattice-cli-${{ matrix.target }}
          path: ${{ env.CRYSTAL_RELEASE_ARCHIVE }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/crystal-lattice-cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cli-release
    permissions:
      # Required only to create or update the GitHub Release.
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: crystal-lattice-cli-*
          path: release-assets
          merge-multiple: true

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#crystal-lattice-cli-v}"
          expected=(
            "crystal-lattice-python-runtime-v${version}-darwin-amd64.tar.gz"
            "crystal-lattice-python-runtime-v${version}-darwin-arm64.tar.gz"
            "crystal-lattice-python-runtime-v${version}-linux-amd64.tar.gz"
            "crystal-lattice-python-runtime-v${version}-linux-arm64.tar.gz"
            "crystal-lattice-python-runtime-v${version}-windows-amd64.zip"
            "crystal-lattice-python-runtime-v${version}-windows-arm64.zip"
          )

          mapfile -t local_assets < <(
            find release-assets -maxdepth 1 -type f -printf '%f\n' |
              sort
          )
          if [ "${#local_assets[@]}" -ne "${#expected[@]}" ]; then
            printf 'Expected %s downloaded archives, found %s:\n' \
              "${#expected[@]}" "${#local_assets[@]}" >&2
            printf '  %s\n' "${local_assets[@]}" >&2
            exit 1
          fi

          release_paths=()
          for name in "${expected[@]}"; do
            printf '%s\n' "${local_assets[@]}" | grep -Fxq "$name" || {
              echo "Missing downloaded release archive: $name" >&2
              exit 1
            }
            release_paths+=("release-assets/$name")
          done

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" \
            "${release_paths[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          mapfile -t published_assets < <(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' |
              sort
          )
          if [ "${#published_assets[@]}" -ne "${#expected[@]}" ]; then
            printf 'Expected %s release assets, found %s:\n' \
              "${#expected[@]}" "${#published_assets[@]}" >&2
            printf '  %s\n' "${published_assets[@]}" >&2
            exit 1
          fi
          for name in "${expected[@]}"; do
            printf '%s\n' "${published_assets[@]}" | grep -Fxq "$name" || {
              echo "Missing GitHub Release asset: $name" >&2
              exit 1
            }
          done
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

  publish-downloads:
    name: Publish Downloads
    needs: publish
    if: startsWith(github.ref, 'refs/tags/crystal-lattice-cli-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cli-release
    permissions:
      contents: read
      # Required only for AWS OIDC in this publication job.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.CLI_DOWNLOADS_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "crystal-lattice-python-runtime-v${GITHUB_REF_NAME#crystal-lattice-cli-v}-*"

      - name: Publish downloads
        env:
          CLI_DOWNLOADS_BUCKET: ${{ vars.CLI_DOWNLOADS_BUCKET }}
          CLI_DOWNLOADS_PREFIX: ${{ vars.CLI_DOWNLOADS_PREFIX }}
          CLI_DOWNLOADS_BASE_URL: ${{ vars.CLI_DOWNLOADS_BASE_URL }}
          CLI_DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLI_DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID }}
          ALLOW_AWS_DEPLOY: "1"
        run: |
          : "${CLI_DOWNLOADS_BUCKET:?CLI_DOWNLOADS_BUCKET repository variable is required}"
          : "${CLI_DOWNLOADS_PREFIX:?CLI_DOWNLOADS_PREFIX repository variable is required}"
          : "${CLI_DOWNLOADS_BASE_URL:?CLI_DOWNLOADS_BASE_URL repository variable is required}"
          version="${GITHUB_REF_NAME#crystal-lattice-cli-v}"
          bash deploy/aws-cli-downloads/publish-assets.sh \
            --assets-dir release-assets \
            --version "$version" \
            --region "${{ vars.AWS_REGION }}" \
            --bucket "$CLI_DOWNLOADS_BUCKET" \
            --prefix "$CLI_DOWNLOADS_PREFIX" \
            --base-url "$CLI_DOWNLOADS_BASE_URL" \
            --distribution-id "$CLI_DOWNLOADS_CLOUDFRONT_DISTRIBUTION_ID"

      - name: Verify published downloads
        env:
          CLI_DOWNLOADS_BASE_URL: ${{ vars.CLI_DOWNLOADS_BASE_URL }}
        run: |
          : "${CLI_DOWNLOADS_BASE_URL:?CLI_DOWNLOADS_BASE_URL repository variable is required}"
          version="${GITHUB_REF_NAME#crystal-lattice-cli-v}"
          ready=0
          for attempt in $(seq 1 20); do
            echo "Checking CDN publication (attempt ${attempt}/20)"
            if bash deploy/aws-cli-downloads/smoke.sh \
              --base-url "$CLI_DOWNLOADS_BASE_URL" \
              --version "$version" \
              --skip-install; then
              ready=1
              break
            fi
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "Published CLI files did not become consistent before timeout" >&2
            exit 1
          fi
          bash deploy/aws-cli-downloads/smoke.sh \
            --base-url "$CLI_DOWNLOADS_BASE_URL" \
            --version "$version"

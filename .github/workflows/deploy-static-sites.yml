name: Deploy Static Sites

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "landing_page/**"
      - "docs/**"
      - "plugins/docs/**"
      - "docs_site/**"
      - "deploy/aws-static-sites/**"
      - ".github/workflows/deploy-static-sites.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Static Sites
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production-sites
    permissions:
      contents: read
      # Required by the AWS deployment step after both sites are built.
      id-token: write
    env:
      PUBLIC_CRYSTAL_LATTICE_SITE_URL: ${{ vars.PUBLIC_CRYSTAL_LATTICE_SITE_URL }}
      PUBLIC_CRYSTAL_LATTICE_DOCS_URL: ${{ vars.PUBLIC_CRYSTAL_LATTICE_DOCS_URL }}
      PUBLIC_CRYSTAL_LATTICE_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_CRYSTAL_LATTICE_UMAMI_SCRIPT_URL }}
      PUBLIC_CRYSTAL_LATTICE_UMAMI_LANDING_ID: ${{ vars.PUBLIC_CRYSTAL_LATTICE_UMAMI_LANDING_ID }}
      PUBLIC_CRYSTAL_LATTICE_UMAMI_DOCS_ID: ${{ vars.PUBLIC_CRYSTAL_LATTICE_UMAMI_DOCS_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: landing_page/yarn.lock

      - name: Build Landing Site
        run: |
          yarn --cwd landing_page install --frozen-lockfile
          yarn --cwd landing_page test:analytics
          yarn --cwd landing_page build

      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs_site/requirements.txt

      - name: Build Docs Site
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs_site/requirements.txt
          python docs_site/scripts/build_mkdocs_site.py

      - name: Validate Deployment Configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          LANDING_BUCKET: ${{ vars.LANDING_BUCKET }}
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          LANDING_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.LANDING_CLOUDFRONT_DISTRIBUTION_ID }}
          DOCS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "${AWS_REGION}"
          test -n "${LANDING_BUCKET}"
          test -n "${DOCS_BUCKET}"
          test -n "${LANDING_CLOUDFRONT_DISTRIBUTION_ID}"
          test -n "${DOCS_CLOUDFRONT_DISTRIBUTION_ID}"
          test -n "${PUBLIC_CRYSTAL_LATTICE_UMAMI_SCRIPT_URL}"
          test -n "${PUBLIC_CRYSTAL_LATTICE_UMAMI_LANDING_ID}"
          test -n "${PUBLIC_CRYSTAL_LATTICE_UMAMI_DOCS_ID}"
          test "${PUBLIC_CRYSTAL_LATTICE_UMAMI_SCRIPT_URL}" = "https://stats.dynamicprogrammingsolutions.com/insight.js"
          [[ "${PUBLIC_CRYSTAL_LATTICE_UMAMI_LANDING_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          [[ "${PUBLIC_CRYSTAL_LATTICE_UMAMI_DOCS_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]
          test "${PUBLIC_CRYSTAL_LATTICE_UMAMI_LANDING_ID}" != "${PUBLIC_CRYSTAL_LATTICE_UMAMI_DOCS_ID}"
          test -n "${AWS_ROLE_TO_ASSUME}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy Landing Site
        env:
          LANDING_BUCKET: ${{ vars.LANDING_BUCKET }}
          LANDING_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.LANDING_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync landing_page/dist/ "s3://${LANDING_BUCKET}/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${LANDING_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Deploy Docs Site
        env:
          DOCS_BUCKET: ${{ vars.DOCS_BUCKET }}
          DOCS_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws s3 sync docs_site/dist/ "s3://${DOCS_BUCKET}/" --delete

          find docs_site/dist -name '*.md' -print0 | while IFS= read -r -d '' file; do
            key="${file#docs_site/dist/}"
            aws s3 cp "$file" "s3://${DOCS_BUCKET}/${key}" \
              --content-type "text/plain; charset=utf-8" \
              --metadata-directive REPLACE >/dev/null
          done

          for file in docs_site/dist/llms.txt docs_site/dist/llms-full.txt; do
            test -f "$file" || continue
            key="${file#docs_site/dist/}"
            aws s3 cp "$file" "s3://${DOCS_BUCKET}/${key}" \
              --content-type "text/plain; charset=utf-8" \
              --metadata-directive REPLACE >/dev/null
          done

          aws cloudfront create-invalidation \
            --distribution-id "${DOCS_CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
# Desired target for landing_page/src/content/pages/home.yaml.
#
# This file is a content target, not a source file loaded by Astro today.
# It intentionally uses new section types such as markdownSection,
# actionGuide, showcase, promptBlock, and codeExample. Implementers should add
# section definitions/components where the current registry cannot render these
# sections. Long copy lives in sibling markdown files so the YAML stays
# structural.

seo:
  title: "Crystal Lattice: Own the harness. Use the agent anywhere."
  description: >-
    A plugin-driven agent workspace for running AI agents your way: from your
    computer, from your phone, and through replaceable tools, prompts, settings,
    session actions, and model-family harnesses.

sections:
  - type: hero
    id: hero
    badge: "Plugin-driven agent workspace"
    titleHtml: 'Own the harness.<br /><span class="highlight">Use the agent anywhere.</span>'
    subtitle: >-
      Crystal Lattice is a plugin-driven platform for running AI agents your
      way: from your computer, from your phone, and through custom tools,
      prompts, settings, and model-family harnesses you can replace.
    actions:
      - label: "Start a workspace"
        href: "#computer-to-phone"
        variant: primary
        icon: arrow
      - label: "View on GitHub"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
        variant: outline
        icon: github
        target: "_blank"
    install:
      prompt: "$"
      command: "curl -fsSL https://crystal-lattice-downloads-874087778966.s3.us-east-1.amazonaws.com/crystal-lattice-cli/install.sh | bash"
      altHtml: "or <code>pipx install crystal-lattice-cli</code>"

  - type: providers
    id: harness-strip
    label: "Harness styles"
    providers:
      - "Codex-style tools"
      - "Claude-style workflows"
      - "Gemini-oriented tools"
      - "Qwen-oriented tools"
      - "Kimi-oriented tools"
      - "Grok-oriented tools"

  - type: actionGuide
    id: computer-to-phone
    eyebrow: "Computer to phone"
    title: "Start at your desk. Keep going from your phone."
    source: "../markdown/computer-to-phone.md"

  - type: actionGuide
    id: bridge
    eyebrow: "Outside your local network"
    title: "Connect through the bridge"
    source: "../markdown/connect-outside-network.md"

  - type: showcase
    id: control
    eyebrow: "Control"
    title: "Control with no compromises"
    source: "../markdown/control-no-compromises.md"
    visual:
      kind: "screenshot"
      src: "/request-options-ui.png"
      alt: "Crystal Lattice request settings exposed by a plugin"
      status: "placeholder-needed"

  - type: markdownSection
    id: model-family-harnesses
    eyebrow: "Model families"
    title: "Harnesses that fit each model family"
    source: "../markdown/model-family-harnesses.md"

  - type: showcase
    id: session-workbench
    eyebrow: "Session workbench"
    title: "Treat sessions as workspaces"
    source: "../markdown/session-workbench.md"
    visual:
      kind: "screenshot"
      src: "/session-workbench.png"
      alt: "Crystal Lattice session actions and session workspace controls"
      status: "placeholder-needed"

  - type: promptBlock
    id: build-plugin
    eyebrow: "Plugins"
    title: "Build or replace a plugin"
    source: "../markdown/build-or-replace-plugin.md"

  - type: codeExample
    id: automate-python
    eyebrow: "Automation"
    title: "Automate the same harness with Python"
    source: "../markdown/automate-with-python.md"

  - type: cta
    title: "Own your agent harness"
    body: >-
      Start a Crystal Lattice workspace on your computer, continue from your
      phone, and replace the plugins that define how the agent behaves.
    actions:
      - label: "Install the CLI"
        href: "#computer-to-phone"
        variant: primary
        icon: arrow
      - label: "Mobile apps coming soon"
        href: "/mobile"
        variant: outline
      - label: "View on GitHub"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
        variant: outline
        icon: github
        target: "_blank"

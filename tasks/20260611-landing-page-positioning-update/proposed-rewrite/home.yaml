# Proposed rewrite for landing_page/src/content/pages/home.yaml.
#
# This is a review artifact, not loaded by Astro today. It intentionally uses
# new section types and visual descriptors so the implementation can add the
# right components instead of flattening the page back into generic cards.

seo:
  title: "Crystal Lattice: Model-native agents you can control"
  description: >-
    A plugin-driven agent platform for people who outgrow one-size-fits-all
    harnesses. Built-in model-family plugins provide Codex, Claude, Gemini,
    Qwen, Kimi, and Grok-style defaults, while your config can replace the
    provider, tools, settings, UI actions, and session workflow.

sections:
  - type: hero
    id: hero
    badge: "Plugin-driven agent platform"
    titleHtml: 'For people who outgrow<br /><span class="highlight">one-size-fits-all agents.</span>'
    subtitle: >-
      Crystal Lattice is a model-native agent platform: the harness changes
      around the model, including its system message, tool schema, request
      behavior, provider-native state, and UI controls. Built-in plugins provide
      Codex, Claude, Gemini, Qwen, Kimi, and Grok-style defaults, and your config
      can replace them.
    actions:
      - label: "Start a workspace"
        href: "#computer-to-phone"
        variant: primary
        icon: arrow
      - label: "View on GitHub"
        href: "https://github.com/dynamicprogrammingsolutions/crystal-lattice"
        variant: outline
        icon: github
        target: "_blank"
    install:
      prompt: "$"
      command: "curl -fsSL https://crystal-lattice-downloads-874087778966.s3.us-east-1.amazonaws.com/crystal-lattice-cli/install.sh | bash"
      altHtml: "or <code>pipx install crystal-lattice-cli</code>"

  - type: providers
    id: harness-strip
    label: "Built-in model-family harnesses"
    providers:
      - "Codex-style tools"
      - "Claude-style workflows"
      - "Gemini-oriented tools"
      - "Qwen-oriented tools"
      - "Kimi-oriented tools"
      - "Grok-oriented tools"

  - type: actionGuide
    id: computer-to-phone
    eyebrow: "Computer to phone"
    title: "Start at your desk. Keep going from your phone."
    body:
      - >-
        Start Crystal Lattice in the project folder where you want the agent to
        work. The terminal UI can stay open, but the work is not trapped there:
        the app UIs can open the same sessions and watch responses stream.
      - >-
        On the same Wi-Fi, Crystal Lattice Control can find your computer
        automatically. Choose Automatic Discovery, select your computer, and
        continue the same workspace from your phone.
    action:
      title: "Run the local workspace"
      steps:
        - label: "Install the CLI"
          code: |
            curl -fsSL https://crystal-lattice-downloads-874087778966.s3.us-east-1.amazonaws.com/crystal-lattice-cli/install.sh | bash
        - label: "Start Crystal Lattice with local discovery"
          code: |
            mkdir -p ~/crystal-lattice-demo
            cd ~/crystal-lattice-demo

            crystal-lattice \
              --server \
              --console \
              --config-local \
              --host 0.0.0.0 \
              --port 9000 \
              --enable-bonjour
        - label: "Open the mobile app"
          text: "Open Crystal Lattice Control, choose Automatic Discovery, and select your computer."
    note: >-
      Automatic discovery uses the local network. If your phone is outside that
      network, use the bridge section below.
    visual:
      kind: "connectionDiagram"
      status: "placeholder-needed"
      desktop: "Show computer runtime on the left and terminal, desktop app, mobile app, and custom UI connected to the same sessions."
      mobile: "Stack the command card first, then a compact connection diagram."

  - type: actionGuide
    id: bridge
    eyebrow: "Outside your local network"
    title: "Pair through a self-hosted bridge"
    body:
      - >-
        Hosted bridge service is coming soon. Today, when your phone is not on
        the same network as your computer, deploy your own bridge and pair
        through it.
      - >-
        The bridge gives Crystal Lattice clients a way to reconnect from outside
        the local network. Local bridge hosting is useful for development and
        testing, but production use should deploy the bridge somewhere reachable.
    action:
      title: "Deploy the bridge on AWS"
      steps:
        - label: "Create the bridge deployment"
          code: |
            ALLOW_AWS_DEPLOY=1 deploy/aws-ec2/build.sh \
              --profile secure \
              --stack-name crystal-lattice-bridge \
              --region us-east-1

            ALLOW_AWS_DEPLOY=1 deploy/aws-ec2/up.sh \
              --profile secure \
              --stack-name crystal-lattice-bridge \
              --region us-east-1
        - label: "Start Crystal Lattice with the bridge URL"
          code: |
            crystal-lattice \
              --server \
              --console \
              --config-local \
              --host 0.0.0.0 \
              --port 9000 \
              --bridge-url wss://<your-cloudfront-domain>/ws/websocket
        - label: "Pair from the phone"
          text: "Open Crystal Lattice Control, choose Bridge Service, enter the bridge URL, select your computer, and enter the pairing code."
    visual:
      kind: "bridgeDiagram"
      status: "placeholder-needed"
      desktop: "Show phone -> bridge -> user's computer, with pairing code callout."
      mobile: "Use three compact steps: deploy, start with URL, pair."

  - type: featureMatrix
    id: model-native-harnesses
    eyebrow: "Model-native harnesses"
    title: "Stop forcing every model through the same prompt and tools."
    intro: >-
      Model-native means Crystal Lattice changes the harness around the model:
      system message, tool schema, request behavior, provider-native state, and
      UI controls. The built-in defaults do this with plugins, and those plugins
      can be replaced.
    columns:
      - key: "modelFamily"
        label: "Model family"
      - key: "builtInHarness"
        label: "Built-in harness"
      - key: "whatChanges"
        label: "What changes"
    rows:
      - modelFamily: "Codex / GPT coding models"
        builtInHarness: "`codex-tools`"
        whatChanges: "Codex-style shell tools, apply patch semantics, skills block, model-family system instructions."
      - modelFamily: "Claude"
        builtInHarness: "`claude-tools`"
        whatChanges: "Claude-oriented tool schema and workflow conventions."
      - modelFamily: "Gemini"
        builtInHarness: "`gemini-tools` + compaction plugins"
        whatChanges: "Gemini-oriented system message and tool behavior, optional compaction flow."
      - modelFamily: "Qwen"
        builtInHarness: "`qwen-tools`"
        whatChanges: "Qwen-oriented tool and instruction style."
      - modelFamily: "Kimi"
        builtInHarness: "`kimi-tools`"
        whatChanges: "Kimi-oriented tools and prompt behavior."
      - modelFamily: "Grok"
        builtInHarness: "`grok-tools`"
        whatChanges: "Grok-oriented tools and request behavior."
      - modelFamily: "OpenAI Responses"
        builtInHarness: "`openai_responses`"
        whatChanges: "Responses-native reasoning, usage/cost metadata, attachments, prompt caching, native compaction."
      - modelFamily: "OpenRouter"
        builtInHarness: "`openrouter`"
        whatChanges: "OpenRouter model routing, reasoning/web/image extensions depending on provider path."
    visual:
      kind: "matrix"
      status: "ready-for-design"
      desktop: "Render configured columns as a readable matrix."
      mobile: "Render rows as horizontal cards using the configured columns."

  - type: featureShowcase
    id: native-provider-features
    eyebrow: "Native provider features"
    title: "Provider-specific behavior can become real UI."
    body:
      - >-
        Some capabilities are not generic chat settings. Reasoning effort,
        verbosity, web search, prompt caching, native compaction, attachment
        handling, usage, and cost metadata depend on the provider path.
      - >-
        Crystal Lattice lets provider and feature plugins expose those controls
        and outputs directly to the UI, so native behavior is visible instead of
        hidden behind a generic wrapper.
    items:
      - title: "Reasoning and verbosity"
        description: "Expose model-specific controls when the provider supports them."
        media:
          kind: "screenshot"
          status: "placeholder-needed"
      - title: "Web search and citations"
        description: "Show search/citation behavior through provider extensions where available."
        media:
          kind: "screenshot"
          status: "placeholder-needed"
      - title: "Prompt caching and compaction"
        description: "Keep long sessions practical with provider-native cache and compaction controls."
        media:
          kind: "screenshot"
          status: "placeholder-needed"
      - title: "Usage, cost, and attachments"
        description: "Surface metadata, generated assets, and attachment handling in the UI."
        media:
          kind: "screenshot"
          status: "placeholder-needed"

  - type: featureCodeShowcase
    id: everything-replaceable
    eyebrow: "Everything is replaceable"
    title: "Serious users eventually disagree with the harness."
    body:
      - >-
        Crystal Lattice treats that as normal. Providers, provider extensions,
        features, tools, application actions, session behavior, and UI elements
        are all plugin surfaces.
      - >-
        The built-in plugins give you useful defaults. Your own plugins can
        replace the parts your workflow disagrees with, and config can point at
        those plugins without waiting for upstream approval.
    note: "Code examples are illustrative placeholders, not final API."
    cards:
      - title: "Provider"
        description: "Add native support for a model API."
        code:
          language: "python"
          value: |
            # Placeholder example, not final API.
            class MyProvider:
                name = "my_provider"

                def to_native_messages(self, messages, state, *, context=None):
                    return convert_to_my_api(messages)

                def stream_api(self, native_messages, state):
                    yield from call_my_model(native_messages, state)
      - title: "Provider extension"
        description: "Surface provider metadata, reasoning, citations, or UI fields."
        code:
          language: "python"
          value: |
            # Placeholder example, not final API.
            class UsageFooter:
                name = "usage_footer"

                def finalize(self, final_messages, native_messages, state):
                    return add_usage_metadata(final_messages, state)

                def get_ui_elements(self, config, context=None):
                    return [
                        {"ui_type": "message_footer", "data": "metadata.total_cost"}
                    ]
      - title: "Feature"
        description: "Transform context, request behavior, or final messages."
        code:
          language: "python"
          value: |
            # Placeholder example, not final API.
            class ProjectContext:
                name = "project_context"

                def to_native_messages(self, messages, native_messages, state):
                    return inject_project_context(native_messages)
      - title: "Tool"
        description: "Expose Python, Node, Bash, or MCP-backed capabilities."
        code:
          language: "python"
          value: |
            # Placeholder example, not final API.
            class SearchTickets:
                name = "search_tickets"

                def get_tool_schemas(self, state):
                    return [ticket_search_schema]

                def execute_tool(self, tool_name, payload, state):
                    return search_linear_or_jira(payload)
      - title: "Application plugin"
        description: "Add session-level workflow actions."
        code:
          language: "python"
          value: |
            # Placeholder example, not final API.
            class CreateReleaseNotes:
                name = "release_notes"

                def get_actions(self, state):
                    return [
                        {
                            "id": "release_notes.create",
                            "label": "Create release notes",
                        }
                    ]

                def execute_action(self, app, action_id, params, context, state):
                    return create_release_notes(app, params)
      - title: "UI schema"
        description: "Render settings and actions in app UIs without hardcoding them."
        code:
          language: "python"
          value: |
            # Placeholder example, not final API.
            def get_ui_elements(self, config, context=None):
                return [
                    {
                        "ui_type": "session_action",
                        "label": "Sync down",
                        "action_id": "cloud.sync_down",
                    },
                    {
                        "type": "select",
                        "key": "reasoning_effort",
                        "label": "Reasoning effort",
                    },
                ]

  - type: screenshotGallery

    eyebrow: "Session workbench"
    title: "Treat sessions as workspaces, not disposable chats."
    body:
      - >-
        Agent work is more than a transcript. Built-in session plugins turn
        conversations into durable workspaces with titles, pinned state,
        summaries, snapshots, attachments, ordering, and session actions.
      - >-
        The workbench is plugin-driven too: built-in plugins provide the default
        behavior, and your own plugins can add or replace workflow actions.
    gallery:
